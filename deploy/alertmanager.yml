# Alertmanager configuration for task-platform
# See: https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m

# Root route — all alerts go through here
route:
  receiver: "webhook-notifications"
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

  # Child routes for severity-based overrides
  routes:
    - match:
        severity: critical
      receiver: "webhook-notifications"
      group_wait: 0s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "webhook-notifications"
      repeat_interval: 4h

receivers:
  - name: "webhook-notifications"
    webhook_configs:
      - url: "http://localhost:9999/alerts"
        send_resolved: true
        max_alerts: 10
