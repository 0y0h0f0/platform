apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-platform

resources:
  - ../../base

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-gateway
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: user-service
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: task-service
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
    target:
      kind: Deployment
      name: api-gateway
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: api-gateway
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
    target:
      kind: Deployment
      name: user-service
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: user-service
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
    target:
      kind: Deployment
      name: task-service
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: task-service

images:
  - name: task-platform/api-gateway
    newTag: latest
  - name: task-platform/user-service
    newTag: latest
  - name: task-platform/task-service
    newTag: latest
  - name: task-platform/web
    newTag: latest
