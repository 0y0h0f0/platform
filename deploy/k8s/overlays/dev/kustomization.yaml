apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-platform
resources:
- ../../base
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
  target:
    kind: Deployment
    name: api-gateway
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
  target:
    kind: Deployment
    name: user-service
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
  target:
    kind: Deployment
    name: task-service
- patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy",
    "value": "Never"}]'
  target:
    kind: Deployment
    name: api-gateway
- patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy",
    "value": "Never"}]'
  target:
    kind: Deployment
    name: user-service
- patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy",
    "value": "Never"}]'
  target:
    kind: Deployment
    name: task-service
- patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy",
    "value": "Never"}]'
  target:
    kind: Deployment
    name: web
images:
- name: task-platform/api-gateway
  newTag: dev
- name: task-platform/user-service
  newTag: dev
- name: task-platform/task-service
  newTag: dev
- name: task-platform/web
  newTag: dev
