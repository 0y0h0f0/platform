apiVersion: v1
kind: Secret
metadata:
  name: task-platform-secrets
  namespace: task-platform
  labels:
    app.kubernetes.io/part-of: task-platform
type: Opaque
stringData:
  # IMPORTANT: Replace all placeholder values below with real secrets before deploying.
  # Use a tool like Sealed Secrets, External Secrets Operator, or SOPS to manage these.
  # These placeholders will cause startup validation failures.
  JWT_SECRET: CHANGE_ME_MIN_32_CHARS_REQUIRED
  INTERNAL_TOKEN: CHANGE_ME_MIN_16_CHARS_REQUIRED
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
  POSTGRES_DB: task_platform
  REDIS_PASSWORD: CHANGE_ME_REDIS_PASSWORD
  GRAFANA_USER: admin
  GRAFANA_PASSWORD: CHANGE_ME_GRAFANA_PASSWORD
  POSTGRES_DSN: host=postgres port=5432 user=postgres password=CHANGE_ME_POSTGRES_PASSWORD dbname=task_platform sslmode=disable
