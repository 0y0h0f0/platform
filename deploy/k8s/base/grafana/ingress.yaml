apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: task-platform
  labels:
    app: grafana
    app.kubernetes.io/part-of: task-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.task-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
