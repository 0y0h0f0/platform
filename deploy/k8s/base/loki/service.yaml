apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: task-platform
  labels:
    app: loki
    app.kubernetes.io/part-of: task-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP
      name: http
    - port: 9096
      targetPort: 9096
      protocol: TCP
      name: grpc
  selector:
    app: loki
