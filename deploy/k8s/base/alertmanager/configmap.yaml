apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: task-platform
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: task-platform
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "webhook-notifications"
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h

      routes:
        - match:
            severity: critical
          receiver: "webhook-notifications"
          group_wait: 0s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: "webhook-notifications"
          repeat_interval: 4h

    receivers:
      - name: "webhook-notifications"
        webhook_configs:
          - url: "http://localhost:9999/alerts"
            send_resolved: true
            max_alerts: 10
