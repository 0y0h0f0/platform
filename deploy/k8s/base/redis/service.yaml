apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: task-platform
  labels:
    app: redis
    app.kubernetes.io/part-of: task-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
