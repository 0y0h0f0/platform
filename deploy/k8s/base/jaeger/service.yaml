apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: task-platform
  labels:
    app: jaeger
    app.kubernetes.io/part-of: task-platform
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: ui
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
  selector:
    app: jaeger
