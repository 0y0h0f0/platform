global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: user-service-admin
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: task-service-admin
    static_configs:
      - targets: ["host.docker.internal:8082"]

