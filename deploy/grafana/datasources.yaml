apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    editable: false
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: jaeger
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags: []
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
