name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Proto
        run: make proto

      - name: Lint Proto
        run: make proto-lint

      - name: Lint Go
        run: make lint

      - name: Run Tests
        run: make test

      - name: Enforce Coverage
        run: ./scripts/coverage.sh

